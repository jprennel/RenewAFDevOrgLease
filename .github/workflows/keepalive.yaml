# Prevents GitHub from disabling scheduled workflows after 60 days of repository inactivity.
# Workflow runs alone do not count as activity; this job creates a lightweight commit.
name: Repository Keepalive

on:
  schedule:
    - cron: '0 12 1,15 * *'  # 1st and 15th of each month at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

      - name: Commit repository activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: repository keepalive"
          git push

      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/renew.yaml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yaml/enable"
